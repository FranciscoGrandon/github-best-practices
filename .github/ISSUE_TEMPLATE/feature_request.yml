name: 🚀 Feature Request
description: Suggest an improvement or new feature
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement! Please fill out the form below.

  - type: checkboxes
    attributes:
      label: Prerequisites
      options:
        - label: I have checked that this feature has not already been requested
          required: true
        - label: This feature would be useful for others
          required: true

  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of the feature request
      placeholder: |
        The feature should allow users to...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Problem it solves
      description: What problem does this feature solve?
      placeholder: |
        Currently, users have to... which is inconvenient because...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe how the feature should work
      placeholder: |
        The implementation could...
        Example usage:
        ```
        code here
        ```
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternative solutions
      description: Have you considered other ways to solve this?
      placeholder: |
        Another approach could be...

  - type: textarea
    attributes:
      label: Additional context
      description: Any additional information
      placeholder: |
        This feature would be especially useful for...
