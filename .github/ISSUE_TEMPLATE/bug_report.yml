name: 🐛 Bug Report
description: Report a bug or issue
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below to help us understand and fix the issue.

  - type: checkboxes
    attributes:
      label: Prerequisites
      options:
        - label: I have checked that this issue has not already been reported
          required: true
        - label: I have confirmed this bug exists in the latest version
          required: true
        - label: I have confirmed this bug exists when following the documented steps
          required: true

  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: |
        When I do X, the expected behavior is Y but instead Z happens.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the problem
      placeholder: |
        1. Go to...
        2. Click on...
        3. Scroll down to...
        4. See error...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
      description: What you expected to happen
      placeholder: |
        The application should...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual behavior
      description: What actually happened
      placeholder: |
        The application instead...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Screenshots/Logs
      description: If applicable, add screenshots, error messages, or logs
      placeholder: |
        Paste screenshots, error traces, or logs here.

  - type: dropdown
    attributes:
      label: Environment
      description: In which environment did you encounter this bug?
      options:
        - Local development
        - Staging
        - Production
        - Not applicable
    validations:
      required: true

  - type: textarea
    attributes:
      label: System information
      description: Information about your system
      placeholder: |
        - OS: macOS 13.0
        - Browser: Chrome 120
        - Node version: 20.x
        - Framework/Library version: 1.2.3

  - type: textarea
    attributes:
      label: Additional context
      description: Any additional information that might be helpful
      placeholder: |
        This issue started after updating to version X...
